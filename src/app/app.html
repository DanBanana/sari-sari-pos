<div class="pos-container">
  <header class="header">
    <h1>DanKiel POS</h1>
    <button
      class="btn-clear"
      (click)="cartService.clearAll()"
      *ngIf="cartService.items().length > 0"
    >
      Clear All
    </button>
  </header>

  <main class="item-list">
    @for (item of cartService.items(); track item.id; let i = $index) {
      <div class="item-card">
        <div class="card-header">
          <span class="item-number">Item #{{ i + 1 }}</span>
          <button
            class="btn-remove"
            (click)="cartService.removeItem(item.id)"
            aria-label="Remove item"
          >
            ✕
          </button>
        </div>

        <div class="card-body">
          <div class="form-group">
            <label>Item Name</label>
            <input
              type="text"
              [ngModel]="item.name"
              (ngModelChange)="cartService.updateItemName(item.id, $event)"
              placeholder="e.g. Pancit Canton"
            />
          </div>

          <div class="form-row">
            <div class="form-group field-price">
              <label>Price (₱)</label>
              <input
                type="number"
                inputmode="decimal"
                [ngModel]="item.price"
                (ngModelChange)="cartService.updateItemPrice(item.id, $event)"
                placeholder="0.00"
                min="0"
              />
            </div>

            <div class="form-group field-qty">
              <label>Qty</label>
              <div class="qty-control">
                <button (click)="cartService.updateItemQuantity(item.id, item.quantity - 1)">
                  -
                </button>
                <input
                  type="number"
                  inputmode="numeric"
                  [ngModel]="item.quantity"
                  (ngModelChange)="cartService.updateItemQuantity(item.id, $event)"
                  min="1"
                />
                <button (click)="cartService.updateItemQuantity(item.id, item.quantity + 1)">
                  +
                </button>
              </div>
            </div>
          </div>

          <div class="item-subtotal">
            <span>Subtotal:</span>
            <strong>₱{{ cartService.getItemSubtotal(item) | number: '1.2-2' }}</strong>
          </div>
        </div>
      </div>
    }

    <button class="btn-add-item" (click)="cartService.addItem()">+ Add Item</button>
  </main>

  <footer class="sticky-footer">
    <div class="summary-info">
      <span
        >Total Items: <strong>{{ cartService.totalItemCount() }}</strong></span
      >
      <div class="grand-total">
        <span>Overall Total:</span>
        <span class="amount">₱{{ cartService.grandTotal() | number: '1.2-2' }}</span>
      </div>
    </div>
  </footer>
</div>
